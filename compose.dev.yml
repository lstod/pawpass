services:
  dev:
    build: { context: ., dockerfile: Dockerfile.dev }
    command: sh -c "[ -x node_modules/.bin/next ] || npm ci; exec npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports: ["127.0.0.1:${DEV_PORT:-3000}:3000"]
    environment:
      TZ: America/Vancouver
      DATABASE_PATH: /app/db/pawpass.db
      BETTER_AUTH_URL: http://localhost:${DEV_PORT:-3000}
      BETTER_AUTH_SECRET: local-dev-only-secret-not-used-in-production-000
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next:/app/.next
volumes:
  node_modules:
  next:
